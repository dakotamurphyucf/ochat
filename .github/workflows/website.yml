name: Website
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # No path filters: lib/, bin/, generator/test inputs and packages also gate release.
  semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      # dune-project selects these source repositories; opam install does not
      # consume Dune's (pin ...) stanzas. Match the qualified local sources.
      - name: Pin project source dependencies
        run: |
          # The qualified TextMate fork uses the pre-0.2 Oniguruma API.
          opam pin add --no-action --yes oniguruma 0.1.2
          opam pin add --no-action --yes textmate-language.0.4.0 'git+https://github.com/dakotamurphyucf/ocaml-textmate-language.git#e9d1ea854b0734db5e616cacb2ce7e2e5fd744bf'
          opam pin add --no-action --yes piaf.0.2.0 'git+https://github.com/anmonteiro/piaf.git#c7428ec14dc681e0ef13375cdf657b2727143678'
      - run: opam install . --deps-only --with-test -y
      - name: Record installed toolchain
        run: |
          mkdir -p website/.release
          opam list --installed --columns=name,version --color=never > website/.release/opam-packages.txt
          opam pin list --color=never > website/.release/opam-pins.txt
      - name: Record reproducible Linux dependency candidate
        run: |
          opam lock . --lock-suffix=ci
          cp ochat.opam.ci website/.release/ochat.opam.locked
      - run: opam exec -- node website/scripts/check-semantics.mjs website/.release/semantic-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: website-semantic-evidence
          path: |
            website/.release/semantic-report.json
            website/.release/opam-packages.txt
            website/.release/opam-pins.txt
            website/.release/ochat.opam.locked
  framework:
    strategy:
      fail-fast: false
      matrix:
        tier: [normal, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
      # dune-project selects these source repositories; opam install does not
      # consume Dune's (pin ...) stanzas. Match the qualified local sources.
      - name: Pin project source dependencies
        run: |
          # The qualified TextMate fork uses the pre-0.2 Oniguruma API.
          opam pin add --no-action --yes oniguruma 0.1.2
          opam pin add --no-action --yes textmate-language.0.4.0 'git+https://github.com/dakotamurphyucf/ocaml-textmate-language.git#e9d1ea854b0734db5e616cacb2ce7e2e5fd744bf'
          opam pin add --no-action --yes piaf.0.2.0 'git+https://github.com/anmonteiro/piaf.git#c7428ec14dc681e0ef13375cdf657b2727143678'
      - run: opam install . --deps-only --with-test -y
      - name: Run framework tests
        run: opam exec -- node .github/scripts/framework-tests.mjs ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-evidence-${{ matrix.tier }}
          include-hidden-files: true
          retention-days: 90
          path: |
            .ci-evidence/
            _build/log
            _build/agent-e2e-artifacts/
            _build/agent-e2e-reports/
  website:
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    env:
      SITE_ENV: ${{ matrix.environment }}
      SITE_URL: ${{ matrix.environment == 'production' && 'https://ochatlabs.com' || 'http://localhost:4321' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run measure:performance
      - run: npm run evaluate:search
      - run: npm run test:browser -- --workers=2
      - name: Retain tested production artifact
        if: matrix.environment == 'production'
        run: |
          mkdir -p .release
          npm run artifact -- retain .release/candidate
          cp test-results/.last-run.json .release/candidate/browser-result.json
      - name: Validate Cloudflare production packaging
        if: matrix.environment == 'production'
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config .release/candidate/wrangler.jsonc --env production
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config .release/candidate/redirect/wrangler.jsonc
      - name: Upload tested production artifact
        if: matrix.environment == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: website-production-release
          path: website/.release/candidate/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: website-evidence-${{ matrix.environment }}
          path: |
            website/.generated/capacity-report.json
            website/.generated/applications-report.json
            website/.generated/content-report.json
            website/.generated/migration-report.json
            website/.generated/migration-report.md
            website/.generated/build-evidence.json
            website/.generated/examples-report.json
            website/.generated/publishing-assets.json
            website/.generated/media-report.json
            website/.generated/performance-report.json
            website/.generated/search-index-report.json
            website/.generated/search-report.json
            website/.generated/search-report.md
            website/test-results/
  release-gate:
    if: always()
    needs: [semantics, framework, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          SEMANTICS_RESULT: ${{ needs.semantics.result }}
          FRAMEWORK_RESULT: ${{ needs.framework.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$SEMANTICS_RESULT" = success
          test "$FRAMEWORK_RESULT" = success
          test "$WEBSITE_RESULT" = success
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-gate.result == 'success'
    needs: [release-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ochatlabs.com
    concurrency:
      group: ochat-website-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: website-production-release
          path: website/.release/candidate
      - uses: actions/download-artifact@v4
        with:
          name: website-semantic-evidence
          path: website/.release/semantics
      - name: Verify exact qualified release
        run: node scripts/verify-production.mjs .release/candidate .release/semantics/semantic-report.json
      - name: Publish qualified release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-production.mjs .release/candidate .release/semantics/semantic-report.json .release/deployment.json
      - name: Verify live production
        run: node scripts/rehearse-hosted.mjs .release/candidate .release/hosted-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-deployment-evidence
          path: |
            website/.release/deployment.json
            website/.release/hosted-production.json
            website/.release/candidate/approval.json
          include-hidden-files: true
          retention-days: 90
# GitHub Actions is the sole production publisher. Pull requests never deploy.
# Keep Cloudflare Git auto-deployment and alternate publication triggers disabled.
