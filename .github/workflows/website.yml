name: Website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Full validation, a qualified main redeployment, or a cold dependency audit
        type: choice
        options: [validate, redeploy, cold]
        default: validate
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Always start detection and the final gate. Do not use workflow path filters.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      framework: ${{ steps.select.outputs.framework }}
      semantics: ${{ steps.select.outputs.semantics }}
      website: ${{ steps.select.outputs.website }}
      deploy: ${{ steps.select.outputs.deploy }}
      cold: ${{ steps.select.outputs.cold }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - name: Test change selection and gate enforcement
        run: node --test .github/tests/*.test.mjs
      - id: select
        name: Select checks and publication
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/select-checks.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-selection
          overwrite: true
          path: .ci-evidence/selection.json
          include-hidden-files: true
          retention-days: 90
  semantics:
    needs: changes
    if: needs.changes.outputs.semantics == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - uses: ./.github/actions/setup-ochat
        with:
          cold: ${{ needs.changes.outputs.cold }}
          tier: semantics
      - name: Record installed toolchain
        run: |
          mkdir -p website/.release
          cp .ci-evidence/* website/.release/
          cp ochat.opam.locked website/.release/ochat.opam.locked
      - run: opam exec -- node website/scripts/check-semantics.mjs website/.release/semantic-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: website-semantic-evidence
          overwrite: true
          path: |
            website/.release/semantic-report.json
            website/.release/opam-packages.txt
            website/.release/opam-pins.txt
            website/.release/ochat.opam.locked
            website/.release/toolchain.json
            website/.release/toolchain-key.json
  framework:
    needs: changes
    if: needs.changes.outputs.framework == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: [normal, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - uses: ./.github/actions/setup-ochat
        with:
          cold: ${{ needs.changes.outputs.cold }}
          tier: ${{ matrix.tier }}
      - name: Run framework tests
        run: opam exec -- node .github/scripts/framework-tests.mjs ${{ matrix.tier }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-evidence-${{ matrix.tier }}
          overwrite: true
          include-hidden-files: true
          retention-days: 90
          path: |
            .ci-evidence/
            _build/log
            _build/agent-e2e-artifacts/
            _build/agent-e2e-reports/
  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    env:
      SITE_ENV: ${{ matrix.environment }}
      SITE_URL: ${{ matrix.environment == 'production' && 'https://ochatlabs.com' || 'http://localhost:4321' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run measure:performance
      - run: npm run evaluate:search
      - name: Retain build and discover complete browser suite
        run: |
          mkdir -p .release
          npm run artifact -- retain .release/candidate
          node scripts/browser-ci.mjs plan .release/candidate
      - name: Validate Cloudflare production packaging
        if: matrix.environment == 'production'
        run: |
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config .release/candidate/wrangler.jsonc --env production
          node node_modules/wrangler/bin/wrangler.js deploy --dry-run --config .release/candidate/redirect/wrangler.jsonc
      - name: Upload prepared build for browser shards
        uses: actions/upload-artifact@v4
        with:
          name: website-build-${{ matrix.environment }}
          overwrite: true
          path: website/.release/candidate/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: website-evidence-${{ matrix.environment }}
          overwrite: true
          path: |
            website/.generated/capacity-report.json
            website/.generated/applications-report.json
            website/.generated/content-report.json
            website/.generated/migration-report.json
            website/.generated/migration-report.md
            website/.generated/build-evidence.json
            website/.generated/examples-report.json
            website/.generated/publishing-assets.json
            website/.generated/media-report.json
            website/.generated/performance-report.json
            website/.generated/search-index-report.json
            website/.generated/search-report.json
            website/.generated/search-report.md
            website/test-results/
  browser:
    needs: [changes, website]
    if: needs.changes.outputs.website == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SITE_ENV: ${{ matrix.environment }}
      SITE_URL: ${{ matrix.environment == 'production' && 'https://ochatlabs.com' || 'http://localhost:4321' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: website-build-${{ matrix.environment }}
          path: website/.release/candidate
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Test prepared artifact on shard ${{ matrix.shard }}/2
        run: node scripts/browser-ci.mjs run .release/candidate ${{ matrix.shard }}
      - name: Retain shard report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-${{ matrix.environment }}-${{ matrix.shard }}
          path: website/.release/browser/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          overwrite: true
  website-qualification:
    needs: [changes, website, browser]
    # Merge failed shards for diagnosis too; qualification still fails closed.
    if: "!cancelled() && needs.changes.outputs.website == 'true' && needs.website.result == 'success'"
    strategy:
      fail-fast: false
      matrix:
        environment: [preview, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_ENV: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: website-build-${{ matrix.environment }}
          path: website/.release/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: website-browser-${{ matrix.environment }}-*
          path: website/.release/shards
      - name: Merge reports and require complete browser coverage
        run: node scripts/browser-ci.mjs merge .release/candidate
      - name: Upload qualified production artifact
        if: matrix.environment == 'production' && needs.browser.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: website-production-release
          path: website/.release/candidate/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          overwrite: true
      - name: Retain merged browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-qualification-${{ matrix.environment }}
          path: |
            website/.release/browser/
            website/.release/candidate/browser-result.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
          overwrite: true
  release-gate:
    if: always()
    needs: [changes, semantics, framework, website, browser, website-qualification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
      - name: Require every selected validation job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/release-gate.mjs
  deploy-production:
    if: always() && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true' && needs.release-gate.result == 'success'
    needs: [changes, release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://ochatlabs.com
    concurrency:
      group: ochat-website-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: website-production-release
          path: website/.release/candidate
      - uses: actions/download-artifact@v4
        with:
          name: website-semantic-evidence
          path: website/.release/semantics
      - name: Verify exact qualified release
        run: node scripts/verify-production.mjs .release/candidate .release/semantics/semantic-report.json
      - name: Publish qualified release
        env:
          CI_DEPLOY_MODE: ${{ inputs.mode }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-production.mjs .release/candidate .release/semantics/semantic-report.json .release/deployment.json
      - name: Verify live production
        run: node scripts/rehearse-hosted.mjs .release/candidate .release/hosted-production.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-deployment-evidence
          overwrite: true
          path: |
            website/.release/deployment.json
            website/.release/hosted-production.json
            website/.release/candidate/approval.json
          include-hidden-files: true
          retention-days: 90
# GitHub Actions is the sole production publisher. Pull requests never deploy.
# Keep Cloudflare Git auto-deployment and alternate publication triggers disabled.
